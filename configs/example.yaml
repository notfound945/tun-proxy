version: 1

log:
  level: info
  format: text

system:
  state_file: /var/run/tun-proxy/state.json
  lock_file: /var/run/tun-proxy/tun-proxy.lock
  manage_dns: true

capture:
  # false 时只捕获 Fake IP 前缀流量。纯 ip_cidr 规则只有设为 true 后，
  # 才能匹配普通真实 IP 或 literal-IP 流量。domain/domain_suffix 与
  # ip_cidr 的组合规则在 false 时仍可生效，因为显式域名条件会分配 Fake IP。
  default_route: false

tun:
  address: 10.255.0.2
  peer: 10.255.0.1
  # 启用 fake_ipv6 时必须同时配置以下两个字段：
  # ipv6_address: fd00:7475:6e70:ffff::2
  # ipv6_peer: fd00:7475:6e70:ffff::1
  mtu: 1400
  packet_queue: 1024
  buffer_pool: 128

fake_ip:
  cidr: 198.18.0.0/15
  dns_ttl: 1m
  mapping_ttl: 24h
  max_mappings: 65536
  persistence_file: /var/lib/tun-proxy/fake-ip.yaml
  exclude:
    - localhost
    - "*.local"
    - "*.lan"

# 只有配置此区块及 tun.ipv6_address、tun.ipv6_peer 后，才会启用 Fake AAAA。
# TUN 点对点地址必须位于此 Fake IPv6 前缀之外。
# fake_ipv6:
#   cidr: fd00:7475:6e70::/96
#   max_mappings: 65536
#   persistence_file: /var/lib/tun-proxy/fake-ipv6.yaml

dns:
  listen: 127.0.0.1:53
  udp: true
  tcp: true
  default_outbound: wifi
  max_concurrent: 256

sessions:
  max_tcp_flows: 1024
  udp_idle_timeout: 2m
  max_udp_sessions: 4096
  max_udp_sessions_per_source: 256

outbounds:
  wifi:
    type: direct
    interface: en0
    # 优先使用该网卡的 DHCP DNS；以下必填列表作为发现失败时的回退地址。
    dns_source: dhcp
    dns:
      - "1.1.1.1:53"
      - "8.8.8.8:53"
    connect_timeout: 10s
    fallback: reject

  wired:
    type: direct
    interface: en5
    # static 模式始终使用以下必填 DNS 列表，不读取 DHCP DNS。
    dns_source: static
    dns:
      - "9.9.9.9:53"
    connect_timeout: 10s
    fallback: wifi

  reject:
    type: reject

# 规则只支持 domain、domain_suffix 和 ip_cidr。命中 domain/domain_suffix
# 规则的域名会获得 Fake IP；其他域名通过 dns.default_outbound 解析真实地址。
# 如果纯 ip_cidr 规则需要覆盖普通真实 IP 或 literal-IP 流量，必须将
# capture.default_route 设为 true。
rules:
  - domain_suffix:
      - claude.ai
      - claude.com
      - usefathom.com
      - anthropic.com
      - claudeusercontent.com
      - claudemcpcontent.com
      - claudemcpclient.com
      - intercomcdn.com
      - snapcraft.io
      - intercom.io
      - datadoghq.com
    outbound: wifi

  - domain:
      - example.com
    outbound: wired

  - domain_suffix:
      - video.example
    outbound: wifi

  - outbound: wifi
