version: 1

log:
  level: info
  format: text

system:
  state_file: /var/run/tun-proxy/state.json
  lock_file: /var/run/tun-proxy/tun-proxy.lock
  manage_dns: true

# Phase 8.4 opt-in. When enabled, tun-proxy installs recorded split-default
# routes only after proving physical-gateway and upstream-DNS bypass routes.
capture:
  default_route: false

tun:
  address: 10.255.0.2
  peer: 10.255.0.1
  # Required together with fake_ipv6:
  # ipv6_address: fd00:7475:6e70:ffff::2
  # ipv6_peer: fd00:7475:6e70:ffff::1
  mtu: 1400
  packet_queue: 1024
  buffer_pool: 128

fake_ip:
  cidr: 198.18.0.0/15
  dns_ttl: 1m
  mapping_ttl: 24h
  max_mappings: 65536
  persistence_file: /var/lib/tun-proxy/fake-ip.yaml
  exclude:
    - localhost
    - "*.local"
    - "*.lan"

# Phase 8.3 enables Fake AAAA only when this block and both tun.ipv6_* fields
# are present. The TUN point-to-point pair must be outside this prefix.
# fake_ipv6:
#   cidr: fd00:7475:6e70::/96
#   max_mappings: 65536
#   persistence_file: /var/lib/tun-proxy/fake-ipv6.yaml

dns:
  listen: 127.0.0.1:53
  udp: true
  tcp: true
  default_outbound: wifi
  max_concurrent: 256

sessions:
  max_tcp_flows: 1024
  udp_idle_timeout: 2m
  max_udp_sessions: 4096
  max_udp_sessions_per_source: 256

outbounds:
  wifi:
    type: direct
    interface: en0
    # DHCP DNS takes priority; this required list is the fallback.
    dns_source: dhcp
    dns:
      - "1.1.1.1:53"
      - "8.8.8.8:53"
    connect_timeout: 10s
    fallback: reject

  wired:
    type: direct
    interface: en5
    # Static mode always uses this required list and ignores DHCP DNS.
    dns_source: static
    dns:
      - "9.9.9.9:53"
    connect_timeout: 10s
    fallback: wifi

  reject:
    type: reject

# Domains selected by domain/domain_suffix rules receive Fake IPs. Other
# domains are resolved to real addresses through dns.default_outbound.
rules:
  - domain_suffix:
      - claude.ai
      - claude.com
      - usefathom.com
      - anthropic.com
      - claudeusercontent.com
      - claudemcpcontent.com
      - claudemcpclient.com
      - intercomcdn.com
      - snapcraft.io
      - intercom.io
      - datadoghq.com
    outbound: wifi

  - domain:
      - example.com
    outbound: wired

  - domain_suffix:
      - video.example
    protocol: udp
    dst_port:
      - 443
    outbound: wifi

  - outbound: wifi
